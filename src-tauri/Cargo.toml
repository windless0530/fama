[package]
name = "fama"
version = "0.1.0"
description = "Multi-AI webview aggregator with unified input"
edition = "2021"

[lib]
name = "fama_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] } # unstable = 多 webview / 子 webview API（WebviewBuilder 等）
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["time"] }
toml = "0.8"
url = "2"
percent-encoding = "2"
# lib.rs setup 里清除窗口 FullSizeContentView 标志位用（版本与 wry 依赖树一致，避免重复编译）
objc2-app-kit = "0.3.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
